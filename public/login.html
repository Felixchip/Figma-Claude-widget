<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/CMC-favicon.png">
<title>Sign in · GSA Build Kit</title>
<style>
  :root {
    --primary1: #E5EBFF; --primary2: #002DCC; --primary3: #325FFF;
    --content1: #FFFFFF; --content5: #000000; --content-secondary: #59627C;
    --outline2: #D6DBDB; --fill1: #F7F7F7; --error3: #E3171A;
    --radius: 16px; --radius-pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: var(--fill1); color: var(--content5);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 380px; background: var(--content1); border: 1px solid var(--outline2);
          border-radius: var(--radius); padding: 32px; box-shadow: 0 12px 32px rgba(0,0,0,0.06); }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .brand img { height: 28px; width: auto; }
  .brand span { font-size: 16px; font-weight: 600; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  p.sub { color: var(--content-secondary); font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: var(--content-secondary); margin: 16px 0 6px; }
  input { width: 100%; padding: 11px 13px; font: inherit; color: var(--content5); background: var(--content1);
          border: 1px solid var(--outline2); border-radius: 8px; }
  input:focus { outline: none; border-color: var(--primary3); box-shadow: 0 0 0 3px var(--primary1); }
  button { width: 100%; margin-top: 24px; padding: 13px 18px; font: inherit; font-weight: 600; cursor: pointer;
           color: #fff; background: var(--primary3); border: none; border-radius: var(--radius-pill); }
  button:hover { background: var(--primary2); }
  .error { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 13px;
           color: var(--error3); background: #FDECEC; }
  .hidden { display: none; }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <div class="brand">
      <img src="/CMC-favicon.png" alt="">
      <span>GSA Build Kit</span>
    </div>
    <h1>Admin sign in</h1>
    <p class="sub">The Library and Settings are restricted to admins. Use the admin token as the password.</p>

    <label for="name">Name</label>
    <input id="name" name="name" required autocomplete="name" autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">

    <input type="hidden" id="next" name="next" value="/">

    <button type="submit">Sign in</button>
    <p id="error" class="error hidden">That didn't match the admin token. Try again.</p>
  </form>

<script>
  var params = new URLSearchParams(location.search);
  var next = params.get('next');
  if (next && next.charAt(0) === '/' && next.charAt(1) !== '/') document.getElementById('next').value = next;
  if (params.get('error')) document.getElementById('error').classList.remove('hidden');
</script>
</body>
</html>
